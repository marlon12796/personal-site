name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate pull request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Biome lint and format check
        id: biome
        run: pnpm exec biome check src

      - name: Typecheck
        id: typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        id: tests
        run: pnpm run test --if-present

      - name: Build Vinext
        id: build
        run: pnpm run build:vinext

      - name: CI summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Biome | ${{ steps.biome.outcome }} |"
            echo "| TypeScript | ${{ steps.typecheck.outcome }} |"
            echo "| Tests | ${{ steps.tests.outcome }} |"
            echo "| Vinext build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
